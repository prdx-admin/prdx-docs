<style>
    body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--main-background-color);
        color: var(--white-color);
        font-family: var(--main-font);
        padding: max(var(--g), env(safe-area-inset-top)) var(--g) max(var(--g), env(safe-area-inset-bottom));
        box-sizing: border-box;
    }
    /* МЕРЫ СТРАНИЦЫ — ТОКЕНЫ ПРИЛОЖЕНИЯ, РАСТУЩИЕ С ОКНОМ. До короткой стороны окна 800 каждая мера равна
       токену приложения; дальше растёт пропорционально: X → max(X px, X / 8 vmin). Ключи читают те же
       токены через наследование, и композиция растёт целиком.
       МОНЕТА БЕРЁТ ОСТАТОК ВЫСОТЫ: окно минус текст, ключи, ссылки и поля, но не шире колонки и не меньше 64. */
    .nf {
        --g: max(7px, 0.875vmin);
        --card-w: max(327.7px, 40.96vmin);
        --action-h: max(52px, 6.5vmin);
        --fs-caption: max(9px, 1.125vmin);
        --lh-caption: max(14px, 1.75vmin);
        --ls-caption: max(2px, 0.25vmin);
        --fs-body: max(12px, 1.5vmin);
        --ls-key: max(1.6px, 0.2vmin);
        --fs-field: max(23.5px, 2.9375vmin);
        --fs-figure: max(30px, 3.75vmin);
        --nf-icon: max(18px, 2.25vmin);
        --nf-pad: max(6px, 0.75vmin);
        --nf-word: var(--fs-field);
        --nf-link-h: calc(var(--nf-icon) + 2 * var(--nf-pad));
        --nf-links-h: calc(2 * var(--nf-link-h) + var(--g));
        --nf-col: min(var(--card-w), 100vw - 14px);
        --nf-rest: calc(14 * var(--g) + var(--nf-word) + var(--lh-caption) + var(--action-h) + var(--nf-links-h));
        --s: max(64px, min(var(--nf-col), 100svh - var(--nf-rest) - 8 * var(--g)));
        width: var(--nf-col);
        display: grid;
        /* колонка — ширина карты; строка ссылок шире неё выходит поровну в обе стороны */
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        text-align: center;
    }
    .nf-coin {
        width: var(--s);
        height: var(--s);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .nf-coin .coin-stage {
        --coin-size: var(--s);
    }
    /* СЛОВО — СЛОВО PARADOX ЗАСТАВКИ: кегль 0.13 монеты, разрядка 0.42 em */
    .nf-word {
        margin: calc(var(--g) * 4) 0 0;
        font-weight: var(--fw-text);
        font-size: var(--nf-word);
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        line-height: 1;
    }
    .nf-note {
        margin: var(--g) 0 0;
        font-size: var(--fs-caption);
        line-height: var(--lh-caption);
        letter-spacing: var(--ls-caption);
        text-indent: var(--ls-caption);
        text-transform: uppercase;
        color: var(--label-color);
    }
    /* ряды — сеткой колонки: отступы `nav` приложения здесь сняты */
    .nf-keys,
    .nf-links {
        box-sizing: border-box;
        padding: 0;
    }
    .nf-keys {
        margin-top: calc(var(--g) * 6);
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--g);
    }
    .nf-keys action-button {
        height: var(--action-h);
        font-size: var(--fs-body);
        letter-spacing: var(--ls-key);
    }
    .nf-app {
        color: var(--accent-deep);
    }
    .nf-tg {
        color: var(--white-color);
    }
    /* РЯД ССЫЛОК — ССЫЛКИ ПОДВАЛА САЙТА: значок 18 и слово, белым; под указателем — mint */
    /* ССЫЛКИ НА ТЕЛЕФОНЕ — СЕТКОЙ 2 × 2 под ключами: каждая колонка — под своим ключом;
       с 768 — одной строкой, шире колонки ключей */
    .nf-links {
        margin-top: calc(var(--g) * 3);
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-items: center;
        gap: var(--g);
    }
    /* ССЫЛКИ ОДНОЙ СТРОКОЙ — с 768 и на телефоне, лёжа на боку: две строки там отняли бы место у монеты */
    @media (min-width: 768px), (orientation: landscape) and (max-height: 500px) {
        .nf {
            --nf-links-h: var(--nf-link-h);
        }
        .nf-links {
            width: max-content;
            display: flex;
            gap: calc(var(--g) * 4);
        }
    }
    @media (min-width: 768px) {
        .nf {
            --nf-word: var(--fs-figure);
        }
    }
    .nf-link {
        display: inline-flex;
        align-items: center;
        gap: var(--g);
        height: var(--nf-link-h);
        box-sizing: border-box;
        padding: var(--nf-pad) 0;
        color: var(--white-color);
        font-size: var(--fs-body);
        font-weight: var(--fw-text);
        text-decoration: none;
        white-space: nowrap;
    }
    .nf-link:hover {
        color: var(--accent);
    }
    .nf-link:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
    }
    .nf-link::before {
        content: "";
        flex: none;
        width: var(--nf-icon);
        height: var(--nf-icon);
        background: center / contain no-repeat;
    }
    .nf-link.site::before {
        background-image: url(https://app.prdxcoin.com/prdx.svg);
    }

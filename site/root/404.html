:root { --bg: #0b0d0d; --panel: #1a1e1f; --edge: #23292b; --label: #7d8a8d; --mint: #5cfaa9; --mint-deep: #0b3f33; --mint-light: #8dfcc4; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: #fff; font: 300 13px/1.5 "Source Code Pro", ui-monospace, monospace; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
main { width: min(328px, 100%); display: grid; justify-items: center; text-align: center; }
.coin { width: 160px; height: 160px; display: block; }
.code { margin: 28px 0 0; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
.lab { margin: 12px 0 0; font-size: 10px; letter-spacing: 3px; color: var(--label); text-transform: uppercase; }
.text { margin: 18px 0 0; color: #c9d1d2; }
.keys { margin-top: 32px; width: 100%; display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.key { height: 52px; border-radius: 26px; corner-shape: superellipse(1.25); display: grid; place-items: center; text-decoration: none; letter-spacing: 2px; font-size: 11px; font-weight: 700; color: #fff; background: var(--panel); border: 1px solid var(--edge); }
.key.primary { background: var(--mint); color: var(--mint-deep); border: 0; font-size: 12px; letter-spacing: 1.5px; font-weight: 800; }
.key:hover { border-color: #3a4446; } .key.primary:hover { background: var(--mint-light); }
.key:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>

# Shared settings of the documentation site. Each language builds from its own config in site/
# (site/en.yml, site/ru.yml), which inherits this file; site/build.sh assembles the sources.
site_name: PARADOX
site_description: PARADOX (PRDX) protocol documentation
site_author: prdx-admin
repo_url: https://github.com/prdx-admin/prdx-docs
repo_name: prdx-admin/prdx-docs
edit_uri: ""
copyright: PARADOX (PRDX) · testnet tokens with no real value

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  # шрифты лежат в stylesheets/fonts.css, не на Google Fonts
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
  features:
    - toc.integrate
    - toc.follow
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/fonts.css
  - stylesheets/prdx.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
  alternate:
    - name: English
      link: https://docs.prdxcoin.com/en/
      lang: en
    - name: Русский
      link: https://docs.prdxcoin.com/ru/
      lang: ru
  social:
    - icon: material/web
      link: https://prdxcoin.com
      name: prdxcoin.com
    - icon: material/cellphone
      link: https://app.prdxcoin.com
      name: app.prdxcoin.com
    - icon: fontawesome/brands/telegram
      link: https://t.me/prdxcoinbot
      name: Telegram app
    - icon: fontawesome/brands/github
      link: https://github.com/prdx-admin/prdx-sim
      name: prdx-sim
